name: quality
on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run on the same PR; keep every push/main run (run_id is unique).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the engines floor (RFC 2026-11-23) and the current LTS
        node: ["22.19", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint .
      - name: typecheck (tsc, if any TypeScript)
        run: |
          if git ls-files '*.ts' '*.tsx' | grep -q .; then npx tsc --noEmit; else echo "no TypeScript yet"; fi
      - run: npm test --if-present
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pipx install ruff==0.15.17 # same pin as .pre-commit-config.yaml
      - run: ruff check tools/
      - run: ruff format --check tools/
      - run: python3 -m unittest discover -s tools/checks
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pipx install pre-commit==4.6.2
      # gitleaks CLI at the pin in .pre-commit-config.yaml, over every commit
      # (fetch-depth 0); same scan as `make gitleaks`. gitleaks-action needs a
      # license key on org repos (GITLEAKS_LICENSE), the CLI does not.
      - run: pre-commit run gitleaks-history --hook-stage manual
