name: release
# Publishes @zanichelli/freshdesk-mcp to public npm when a v* tag is pushed
# (RFC 2026-11-25, release on npm): npm trusted publishing over OIDC from the
# environment `npm`, which only v* tags can enter. No npm token, no secret.
# workflow_dispatch runs the same chain and a dry run that publishes nothing.
# Checked by tools/checks/test_release_workflow.py (keep its layout: jobs at
# two spaces, job keys at four, steps at six).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # quality and gitleaks are copies of quality.yml's quality and checks jobs,
  # not calls: a local reusable workflow is a path and cannot carry a SHA
  # (RFC 2026-11-25). A test keeps their `run:` lines equal to quality.yml's.
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the engines floor (RFC 2026-11-23) and the current LTS
        node: ["22.19", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint .
      - name: typecheck (tsc, if any TypeScript)
        run: |
          if git ls-files '*.ts' '*.tsx' | grep -q .; then npx tsc --noEmit; else echo "no TypeScript yet"; fi
      - run: npm test --if-present
      - run: npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pipx install ruff==0.15.17 # same pin as .pre-commit-config.yaml
      - run: ruff check tools/
      - run: ruff format --check tools/
      - run: python3 -m unittest discover -s tools/checks
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pipx install pre-commit==4.6.2
      # gitleaks CLI at the pin in .pre-commit-config.yaml, over every commit.
      - run: pre-commit run gitleaks-history --hook-stage manual
  # A fresh checkout, built and packed once; publish and dry-run ship this
  # tarball, never a local dist/ (docs/improvements.md, entry 82ab7a6).
  build:
    needs: [quality, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
  publish:
    needs: [quality, gitleaks, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag equals the package.json version
        run: python3 tools/checks/release_version.py "$GITHUB_REF_NAME"
      - name: tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main"; exit 1; }
      # Node 24.22.3 bundles npm 11.19.1, above trusted publishing's 11.5.1.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - name: publish
        run: npm publish ./package/*.tgz --provenance --access public
  # Manual check of the chain and the tarball. No id-token, no environment,
  # no --provenance (it needs the OIDC token): it can only print what a
  # publish would send.
  dry-run:
    needs: [quality, gitleaks, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - run: npm publish ./package/*.tgz --dry-run --access public
